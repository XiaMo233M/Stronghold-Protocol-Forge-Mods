<h1>已上线的 mod</h1>
<p class="sub">这一页只列<b>已通过审核</b>的包，并按<b>「装上会不会生效」分成两处</b>：
  <b>真功能 mod</b>（<b>装上即生效</b> —— 每条都满足「pack.json 在 ZIP 根」并在引擎 0.16.0 的
  干净 workshop 根<b>单独装载过、errors=0</b>）与
  <b>说明包</b>（<b>装上不会启用任何功能</b>，下载下来是给你看的，不是给你装的）。
  另有一处放<b>安装器 / 补丁形态</b>的包（ZIP 根没有 pack.json，要按包内说明手动安装）。<br>
  想投稿请去 <a href="/">上传页</a>。
  规则见 <a href="https://github.com/XiaMo233M/Stronghold-Protocol-Forge-Mods/blob/main/SKILL.md">SKILL.md</a>。</p>

<!-- ================================================================
     ⭐ 关键字搜索框（业主 2026-10-15：「mod 公开页记得加个搜索框」）
     ================================================================
     ⚠️ 约束，写在这里免得下一个人改歪：
       ① **服务端为主**：搜索是**服务端过滤**（`/api/mods?q=…`），不是前端把拿到的数据藏起来 ——
          这一页本来就只拿得到筛过的那一批。匹配字段与口径见 `server.mjs` 的 `matchesQuery`
          （name / author / packId / funcKind，大小写不敏感、首尾空白忽略）。
       ② **表单是真的 `<form method="get" action="/mods">`**：回车与「搜索」按钮都走**浏览器原生提交**，
          没有 JS 也能用。里面两个 hidden 装的是**当前两条筛选**（kind / func）——
          它们是服务端**白名单校验过**才注入的（与 `data-kinds` / `data-funcs` 同一个纪律），
          所以**搜一次不会把分类筛选丢掉**（`?q=…&kind=…&func=…` 三条一起带上）。
       ③ 有 JS 时提交被接管一次：地址交给 `urlWith()` 拼 —— **只带非空的参数**，
          不会产生 `q=&kind=&func=` 这种噪音（服务端认得空值 = 不筛，但地址干净一点更好读）。
       ④ **清除**回到「**没有 q 的地址**」：kind / func 照旧保留（只去掉「搜索」这一维）。
       ⑤ `q` 是**用户自由文本**（不是闭集）：服务端注入 `data-q` 之前**已经转义**
          （见 `server.mjs` 的 renderPage `qAttr`）；这一页只把它放进 `input.value`
          与 `encodeURIComponent`，**从不拼进 HTML**。 -->
<form class="searchbar" id="searchbar" method="get" action="/mods" role="search">
  <label class="searchbar__label" for="q">搜索：</label>
  <input class="searchbar__input" id="q" name="q" type="search" autocomplete="off" spellcheck="false"
         placeholder="搜索模组名 / 作者 / 包 id">
  <button class="searchbar__btn" type="submit">搜索</button>
  <a class="searchbar__clear" id="qclear" href="/mods">清除</a>
  <span class="searchbar__hint" id="qhint"></span>
  <input type="hidden" name="kind" value="__KINDS__">
  <input type="hidden" name="func" value="__FUNCS__">
</form>

<!-- ================================================================
     分类筛选（业主 2026-10-12 需求 ③：让需要的人更快找到对应分类的模组）
     ================================================================
     ⚠️ 约束，写在这里免得下一个人改歪：
       ① **两个维度、两个字段，各筛各的**（2026-10-14 更新）：
          · `packKind` = **技术维度**「装上会不会生效」（functional / documentation / unknown，
            缺省 unknown）—— 这一栏与 `?kind=` **一个字节都没改**，老链接、老判据照旧；
          · `funcKind` = ⭐ **功能维度**「这包是干什么的」（游戏玩法 / 拓展包 / 实用工具 /
            素材替换 / 说明文档 / 未分类，缺省未分类）—— 业主说「要按功能分」指的就是它。
          ⚠️ 两者**故意不复用同一个键**：复用必然互相踩（技术维度还要喂给镜像入选判据）。
       ② **筛选走 URL**：`/mods?kind=functional`、`/mods?func=gameplay,utility`。
          两条**可以叠加**（`?kind=functional&func=utility` = 既装得上、又是实用工具）。
          服务端**白名单校验**过这些值再注进下面的 `data-kinds` / `data-funcs`
          （不把 URL 上的任意值写进 HTML），并且已经在服务端把数据筛过一遍了。
          所以这一页**收藏、分享、刷新都还原得回来**。
          ⭐ 2026-10-15 加搜索（`?q=`）时这条纪律**照旧**，只是多一档：
          关键字 `q` **不是闭集**（用户敲什么就是什么），所以它**转义后**才注进 `data-q`
          （`server.mjs` 的 `qAttr`）；`kind` / `func` 仍然走白名单那条路，两者别混。
       ③ **不传 = 现状**：分区、数据、老判据一条没动；下面这两排按钮只是
          「点一下就跳到一个带参数的地址」，**没有 JS 也能用**（退化成普通链接）。
       ④ 主分区**按功能类目**分（固定 6 个区的顺序），技术维度画在**每条的徽标**上 ——
          两个维度正交，谁都不吞掉谁；`说明文档` 自成一区，业主 2026-10-12 那条
          「说明包不能混在功能包里」的要求**照旧成立**。
     按钮是**真链接**（`<a href>`，不是 JS 拦截），所以中键新开、复制链接、分享都正常。 -->
<nav class="kindbar" id="kindbar" aria-label="按分类筛选">
  <span class="kindbar__label">按「装上会不会生效」筛：</span>
</nav>
<nav class="kindbar" id="funcbar" aria-label="按功能筛选">
  <span class="kindbar__label">按功能分：</span>
</nav>
<div id="list" data-kinds="__KINDS__" data-funcs="__FUNCS__" data-q="__Q__"><p class="dim">正在载入…</p></div>

<script>
const list = document.getElementById('list');
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

// ---- 当前筛选（服务端白名单校验过，只可能是闭集里的值或空串）--------------------
// 空串 = 不筛 = **现状**（三个分区照旧、顺序照旧）。
// ⚠️ `dataset` 要**防一手**：真实浏览器一定有，但极简的 DOM 桩（自测里那种）未必有 ——
//    读不到就当作「不筛」，绝不让它把整个脚本打挂（那样整页就白屏了）。
const ACTIVE = String((list.dataset && list.dataset.kinds) || '').split(',').map((s) => s.trim()).filter(Boolean);
// ⭐ 功能类目的当前筛选（同一个白名单纪律：服务端只注入闭集里过滤过的值）。
const ACTIVE_FUNC = String((list.dataset && list.dataset.funcs) || '').split(',').map((s) => s.trim()).filter(Boolean);
// ⭐ 当前**关键字**（业主 2026-10-15）。服务端已经 `trim` 过；同样**防一手 `dataset`**
// （极简 DOM 桩未必有，读不到就当「没搜」，绝不让它把整个脚本打挂 ⇒ 整页白屏）。
const ACTIVE_Q = String((list.dataset && list.dataset.q) || '');
/** 拼一个地址：三条筛选**各自保留**（各管一件事，可以同时生效）。 */
function urlWith({ kind, func, q }) {
  const parts = [];
  const k = kind !== undefined ? kind : ACTIVE.join(',');
  const f = func !== undefined ? func : ACTIVE_FUNC.join(',');
  const w = q !== undefined ? q : ACTIVE_Q;
  if (w) parts.push(`q=${encodeURIComponent(w)}`);
  if (k) parts.push(`kind=${encodeURIComponent(k)}`);
  if (f) parts.push(`func=${encodeURIComponent(f)}`);
  return parts.length ? `/mods?${parts.join('&')}` : '/mods';
}

// ---- 「装上会不会生效」这一栏（指令③④）----------------------------------------
// 与 `m.kind`（compat / submission）**不是一回事**：`kind` 说的是这条**记录是怎么来的**
// （兼容改写来的，还是原样投上来的）；这里说的是**装上到底会不会生效**。两者正交，所以分开画。
//   functional    真功能   —— 装上即生效（pack.json 在 ZIP 根 + 干净根单独装载 errors=0）；
//   documentation 说明包   —— **装上不会启用任何功能**，下载下来是给你看的；
//   unknown       安装器 / 补丁形态 —— ZIP 根没有 pack.json，不能直接丢进 workshop 目录。
// ⚠️ 记录里缺这一栏一律按 **unknown** 画：**缺省绝不可能是「真功能」** ——
// 否则新批一条没分类的记录，又会在「真功能」区里漏出一个装不上的包。
const KIND_OF = (m) => (m.packKind === 'functional' || m.packKind === 'documentation') ? m.packKind : 'unknown';
const KIND_TITLE = { functional: '真功能 mod', documentation: '说明包', unknown: '其他（未分类 / 安装器·补丁形态）' };
const KIND_HINT = {
  functional: '这些包**装上即生效**：pack.json 在 ZIP 根，并已在引擎 0.16.0 的干净 workshop 根**单独装载过，errors=0**。',
  documentation: '**说明包（装上不会启用任何功能）**：参考 / 说明 / 补丁留档。下载下来是给你看的，不是给你装的。',
  unknown: '这些包**没有通过「真功能」的那三道核**（或者本身就是安装器 / 补丁形态，ZIP 根没有 pack.json）：**不保证装上即生效**，下之前请先看包内说明。',
};
const KIND_BADGE = {
  functional: ['badge ok', '真功能'],
  documentation: ['badge info', '说明包（装上不会启用任何功能）'],
  unknown: ['badge warn', '未核实是否装上即生效'],
};

// ---- ⭐⭐ 功能类目（业主 2026-10-14 裁定的 6 类）--------------------------------
// 与上面那一栏是**两个维度**，故意分开画：
//   · 上面那栏 = 技术维度「装上到底会不会生效」；
//   · 这一栏 = 功能维度「这包是干什么的」—— **业主说「现在分类不对，要按功能分」指的就是这一栏**。
// 缺省一律 `uncategorized`（未分类）：老记录没有这一栏 ⇒ 落未分类，**绝不替它猜一个真功能类**。
const FUNC_OF = (m) => (FUNC_BADGE[m && m.funcKind] ? m.funcKind : 'uncategorized');
const FUNC_TITLE = {
  gameplay: '游戏玩法', expansion: '拓展包', utility: '实用工具',
  assets: '素材替换', documentation: '说明文档', uncategorized: '未分类',
};
const FUNC_HINT = {
  gameplay: '这一类的包**改的是玩法本身**：回合流程、对局规则、角色/技能的判定逻辑。',
  expansion: '这一类的包**往里加东西**：新角色、新卡、新关卡、整合式的内容扩充。',
  utility: '这一类的包**只办事、不改玩法**：面板、查询、设置、批量操作这类工具。',
  assets: '这一类的包**换的是素材**：立绘、图标、音效、字体、界面皮肤 —— 玩法逻辑一个字不动。',
  documentation: '这一类的包**装上不会启用任何功能**，是说明 / 参考 / 资料：下载下来是给你看的，不是给你装的。',
  uncategorized: '**还没归类**（老记录默认落这里，等维护者一条一条看）。这里**不代表它不是好包** —— '
    + '只代表分类这一栏还没人填过，请不要据此判断质量。',
};
const FUNC_BADGE = {
  gameplay: ['badge ok', '游戏玩法'], expansion: ['badge ok', '拓展包'],
  utility: ['badge ok', '实用工具'], assets: ['badge info', '素材替换'],
  documentation: ['badge info', '说明文档'], uncategorized: ['badge warn', '未分类'],
};
// 功能类目的**固定顺序**（页面分区按它走；不按条数排序，免得每次刷新跳来跳去）。
const FUNC_ORDER = ['gameplay', 'expansion', 'utility', 'assets', 'documentation', 'uncategorized'];

// ---- 「同一个 pack id」的成对记录（指令㉑）--------------------------------------
// 引擎**不允许同 id 的两个包并存**：目录名与 `pack.json` 的 `id` 不一致即 `PACK_ID_MISMATCH` 整包被拒；
// 实测同一 workshop 根放两份 id 相同的包，只会装载 1 条、后者**静默覆盖**前者。
// ⇒ 玩家**一次只能装一条**。这件事以前只写在备注里，不看备注就不知道 —— 所以在卡片上直接点出来。
// **拿不到 pack.json id 的记录（packId 是 null）一律不猜、不画**。
function sameIdPeers(all, m) {
  if (!m.packId) return [];
  return all.filter((x) => x.id !== m.id && x.packId === m.packId);
}

// ---- 筛选按钮 ----------------------------------------------------------------
// 每一枚都是**真链接**：点「真功能 mod」就跳到 `?kind=functional`；点「全部」跳回 `/mods`
//（不带参数 = 现状）。当前选中那一枚标 .on。
// URL 也支持多选（`?kind=a,b`）：别人把多选地址发给你，这一页照样**如实显示当前在按哪几档筛**。
function renderKindbar(counts) {
  const bar = document.getElementById('kindbar');
  bar.textContent = '';
  const mk = (label, value, extra) => {
    const on = value === null ? ACTIVE.length === 0 : (ACTIVE.length === 1 && ACTIVE[0] === value);
    const a = el('a', 'kindbtn' + (on ? ' on' : ''), label + (extra != null ? `（${extra}）` : ''));
    a.href = urlWith({ kind: value === null ? '' : value });
    if (on) a.setAttribute('aria-current', 'true');
    return a;
  };
  const c = counts || {};
  bar.append(el('span', 'kindbar__label', '按「装上会不会生效」筛：'));
  bar.append(mk('全部', null, c.total));
  bar.append(mk(KIND_TITLE.functional, 'functional', c.functional));
  bar.append(mk(KIND_TITLE.documentation, 'documentation', c.documentation));
  bar.append(mk(KIND_TITLE.unknown, 'unknown', c.unknown));
  if (ACTIVE.length) {
    // 当前地址带了筛选：把「正在按什么筛」和「怎么退回全部」说清楚（可收藏、可分享）。
    const hint = el('span', 'kindbar__hint', `当前只显示：${ACTIVE.map((k) => KIND_TITLE[k] || k).join(' + ')} · `);
    const back = el('a', null, '看全部');
    back.href = urlWith({ kind: '' });
    hint.append(back);
    bar.append(hint);
  }
}

// ---- ⭐ 功能类目筛选条（业主 2026-10-14）----------------------------------------
// 与上面那条**各管一个维度**、可以**同时生效**：点「游戏玩法」不会把「真功能」那栏清掉。
// 同样是**真链接**（`<a href>`）：中键新开、复制链接、分享、无 JS 都正常。
function renderFuncbar(counts) {
  const bar = document.getElementById('funcbar');
  if (!bar) return;
  bar.textContent = '';
  const mk = (label, value, extra) => {
    const on = value === null ? ACTIVE_FUNC.length === 0 : (ACTIVE_FUNC.length === 1 && ACTIVE_FUNC[0] === value);
    const a = el('a', 'kindbtn' + (on ? ' on' : ''), label + (extra != null ? `（${extra}）` : ''));
    a.href = urlWith({ func: value === null ? '' : value });
    if (on) a.setAttribute('aria-current', 'true');
    return a;
  };
  const c = counts || {};
  bar.append(el('span', 'kindbar__label', '按功能分：'));
  bar.append(mk('全部', null, c.total));
  for (const k of FUNC_ORDER) bar.append(mk(FUNC_TITLE[k], k, c[k]));
  if (ACTIVE_FUNC.length) {
    const hint = el('span', 'kindbar__hint', `当前只显示：${ACTIVE_FUNC.map((k) => FUNC_TITLE[k] || k).join(' + ')} · `);
    const back = el('a', null, '看全部');
    back.href = urlWith({ func: '' });
    hint.append(back);
    bar.append(hint);
  }
}

// ---- ⭐ 搜索框（业主 2026-10-15）----------------------------------------------
// 表单本身就是 `method="get" action="/mods"` ⇒ **回车 / 按钮原生提交**就能用（无 JS 也成立），
// 两个 hidden 带着当前的 kind / func（服务端白名单注入的），所以搜索**不会**把分类筛选清掉。
// 有 JS 时接管一次：地址改由 `urlWith()` 拼 —— 只带非空的参数，空值不会进地址。
// ⚠️ 每一处都要**防桩**（`addEventListener` / `dataset` 在极简 DOM 桩里未必有）：
//    读不到就当没这个控件，绝不让它把脚本打挂 —— 那样整页就白屏了。
const searchbar = document.getElementById('searchbar');
const qInput = document.getElementById('q');
const qClear = document.getElementById('qclear');
const qHint = document.getElementById('qhint');
// 刷新 / 收藏回来的地址要**还原到框里**（与服务端给的那一份同源，不另读 location）。
if (qInput) qInput.value = ACTIVE_Q;
// 「清除」= 去掉「搜索」这一维，kind / func **照旧保留**（href 兜底是无参的 `/mods`）。
if (qClear) qClear.href = urlWith({ q: '' });
if (searchbar && typeof searchbar.addEventListener === 'function') {
  searchbar.addEventListener('submit', (ev) => {
    if (ev && typeof ev.preventDefault === 'function') ev.preventDefault();
    const v = qInput && qInput.value != null ? String(qInput.value).trim() : '';
    location.href = urlWith({ q: v });
  });
}
/** 搜索状态那一行：**现在搜的是什么、命中几条、怎么清掉**（只在真搜了的时候画）。 */
function renderQHint(hits) {
  if (!qHint) return;
  qHint.textContent = '';
  if (!ACTIVE_Q) return;
  qHint.append(document.createTextNode(`搜索「${ACTIVE_Q}」· 命中 ${hits} 条 · `));
  const back = el('a', null, '清除');
  back.href = urlWith({ q: '' });
  qHint.append(back);
}

function card(m, flagged, peers) {
  const c = el('div', 'panel' + (flagged ? ' brackets' : ''));
  if (flagged) c.style.borderLeft = '4px solid var(--gold)';
  const body = el('div', 'panel__body');
  const head = el('div', 'flex');
  const h = el('h2'); h.style.margin = '0'; h.textContent = m.name;
  head.append(h);
  // 兼容改写版：这是「谁由谁改来」的那个改写版，原件只留档、不在这里发。
  if (m.kind === 'compat') head.append(el('span', 'badge ok', flagged ? '兼容版 · 含疑似素材' : '兼容改写版'));
  // 「装上会不会生效」这个徽标**每一条都画**（含疑似素材那一组）：说明包与安装器形态
  // 必须在名字旁边就看得出来，不能等下完了才发现装不上。
  const kb = KIND_BADGE[KIND_OF(m)];
  head.append(el('span', kb[0], kb[1]));
  // ⭐ 功能类目徽标（业主 2026-10-14）：与上面那个技术徽标**并排画**，两个维度都看得见。
  const fb = FUNC_BADGE[FUNC_OF(m)];
  head.append(el('span', fb[0], fb[1]));
  if (flagged) head.append(el('span', 'badge warn', '含疑似官方素材'));
  body.append(head);
  body.append(el('div', 'kv dim', `${(m.size / 1048576).toFixed(2)} MB · 上传于 ${String(m.uploadedAt).slice(0, 10)} · 编号 ${m.id}`));

  // 同 id 提示（指令㉑）：同一行里把「另一条是谁」和「为什么一次只能装一条」都说清。
  if (peers && peers.length) {
    body.append(el('div', 'kv dim',
      `⚠ 与 ${peers.map((p) => `「${p.name}」（编号 ${p.id}）`).join('、')} 同为 pack id 「${m.packId}」`
      + ` —— 引擎不允许同 id 的两个包并存，装第二份会覆盖第一份，所以一次只能装一条。`));
  }

  // 两个署名**分开两栏**显示，谁也不覆盖谁：
  // 原作者来自包自带的 pack.json（兼容包发布时预填、普通投稿由站点在读的时候现读，都不改记录）；
  // 兼容者是站点侧记的（包里的元数据一个字节没动）。
  // 两栏都带标签，免得只看到一个名字被误当成作者。
  // 兼容改写版**一定要显示兼容者这一栏**，哪怕它是空的 —— 空就写「未填」。
  // 把这一栏藏掉，会让人误以为这就是原件自己发的包。
  // 反过来，**普通投稿没有「兼容」这回事** —— 那一栏整栏不画：画一个「（未记）」会让人
  // 以为有个兼容者没填，那不是事实。普通投稿只画「原作者」这一栏。
  const isCompat = m.kind === 'compat';
  if (m.author || isCompat) {
    const box = el('div', 'sigbox');
    const sig = el('div', 'sig');
    sig.append(el('span', 'sigk', '原作者'));
    sig.append(el('span', 'sigv', m.author || '（未记）'));
    if (isCompat) {
      sig.append(el('span', 'sigk', '兼容改写者'));
      sig.append(el('span', 'sigv', m.compatAuthor ? m.compatAuthor : '（未填）'));
    }
    box.append(sig);
    if (isCompat) {
      box.append(el('div', 'sighint', '原作说明与署名原样保留自包内的 pack.json；'
        + '兼容改写是另一个人做的，记在站点侧，没有改动包里的元数据。'));
      if (!m.compatAuthor) {
        box.append(el('div', 'sighint', '「兼容改写者」这一栏**未填** —— 如实显示，站点没有代填任何名字。'));
      }
    }
    body.append(box);
  }
  // 再补一行「这条是从哪条投稿改写来的」（业主 2026-10-11 批准加这一行）。
  // 它说的是**记录之间的沿革**，不是人 —— 与上面那两栏署名是两回事：
  // 原作者 / 兼容改写者说的是「谁做的」，这一行说的是「这条记录由哪条记录改来」。
  // 所以文案里点明「不是原作者署名」，免得被误读成第三个署名。
  // `compatOf` 有值才画；为空（早先手工批准上线的那几条兼容包就是空的）**整行不画** ——
  // 不留「未知」「空」之类的占位：不画就是如实说「没有这条链」。
  if (m.compatOf) {
    const line = el('div', 'kv dim compatof', '由投稿 ' + m.compatOf + ' 改写来（记录沿革，不是原作者署名）');
    line.id = 'compatof-' + m.id;
    body.append(line);
  }
  // 「兼容说明」与「备注」是两个来源不同的栏位：
  //   · `compatNote` 是站点侧的「兼容说明」（管理端点 `/compat/note` 改它）；
  //   · `note` 是记录自己的备注栏。
  // 站点的**存储层**在发布兼容包时会把同一段文案**同时写进两栏**（`server.mjs` 里那是有意为之，
  // 本页不碰存储层、也不碰任何记录的数据），于是**两栏逐字相同**成了常态。
  // 两栏都画 = 同一段字画两遍。所以这里只做**渲染层的去重**，判据一句话：
  //   两栏都非空且（规范化空白后）逐字相同 ⇒ **只画一次**；只有一栏非空 ⇒ 画那一栏；
  //   两栏都空 ⇒ **这一块不画**。两栏内容**不同**时两段都画（不相同就不是重复，不许并掉）。
  // 相等判定先规范化（两端 trim + 连续空白折叠成单空格），免得只差空格还画两遍；
  // **展示用原文**，不改写正文一个字。
  // 相同时画 `compatNote`：它是「兼容说明」的语义栏，且带得出「兼容说明：」这个标签 ——
  // 只画 `note` 会丢掉这个语义。
  const noteKey = (v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
  const cNote = noteKey(m.compatNote);
  const pNote = noteKey(m.note);
  if (cNote) {
    body.append(el('div', 'note', '兼容说明：' + m.compatNote));
    if (pNote && pNote !== cNote) body.append(el('div', 'note', m.note));
  } else if (pNote) {
    body.append(el('div', 'note', m.note));
  }

  // 按钮文案也照实写：说明包点下去不会被当成「装上去就生效的功能包」。
  const kk = KIND_OF(m);
  const dlLabel = kk === 'documentation' ? '下载说明包 zip（不会启用任何功能）'
    : kk === 'unknown' ? '下载 zip（未核实是否装上即生效）'
      : (m.kind === 'compat' ? '下载兼容改写版 zip' : '下载 zip');
  const a = el('a', 'btn btn--primary', dlLabel);
  a.href = m.download;
  a.style.marginTop = '10px';
  body.append(a);
  if (m.homepage) {
    const s = el('div', 'kv dim');
    s.style.marginTop = '8px';
    s.append(document.createTextNode('原件来源：'));
    const hh = el('a', null, m.homepage);
    hh.href = m.homepage; hh.rel = 'noopener noreferrer nofollow';
    s.append(hh);
    body.append(s);
  }
  c.append(body);
  return c;
}

// 带筛选时把**三条**筛选都交给服务端（**服务端过滤**，不是前端把数据藏起来）：
// 这样「筛了之后还剩几条」与服务端算的一致，页面也不用先下载全量再丢掉。
// 不筛、也不搜时**一个参数都不带** —— 现状那条请求逐字不变。
const qs = [];
if (ACTIVE_Q) qs.push(`q=${encodeURIComponent(ACTIVE_Q)}`);
if (ACTIVE.length) qs.push(`kind=${encodeURIComponent(ACTIVE.join(','))}`);
if (ACTIVE_FUNC.length) qs.push(`func=${encodeURIComponent(ACTIVE_FUNC.join(','))}`);
const apiUrl = qs.length ? `/api/mods?${qs.join('&')}` : '/api/mods';
fetch(apiUrl).then((r) => r.json()).then(({ mods, flagged, counts }) => {
  list.textContent = '';
  mods = mods || []; flagged = flagged || [];
  // 同 id 的「另一条」可能落在**任何一组**里（含疑似素材那一组），所以并起来找。
  const all = mods.concat(flagged);
  // ⭐ 搜索状态那一行（业主 2026-10-15）：命中的是**这一批**（含疑似素材那组），
  //    与服务端过滤后的条数同一个数 —— 屏幕上「还剩几条」与这一行永远对得上。
  renderQHint(all.length);
  // 筛选条：不筛时 counts 是**全站每类计数**（服务端给）；筛过时服务端不给 counts
  //（免得「functional 只有 1 条」这种被筛小的数误导）——那时退回按当前这批自己数。
  const shown = {
    total: all.length,
    functional: all.filter((m) => KIND_OF(m) === 'functional').length,
    documentation: all.filter((m) => KIND_OF(m) === 'documentation').length,
    unknown: all.filter((m) => KIND_OF(m) === 'unknown').length,
  };
  const shownFunc = { total: all.length };
  for (const k of FUNC_ORDER) shownFunc[k] = all.filter((m) => FUNC_OF(m) === k).length;
  // ⚠️ 两个维度的计数**各按各的 counts 画**：`counts.func` 是功能那 6 类；
  //    老服务端（没有 counts.func）时退回按当前这批自己数，绝不让筛选条空着。
  renderKindbar(counts || shown);
  renderFuncbar((counts && counts.func) ? { ...counts.func, total: counts.total } : shownFunc);
  if (!mods.length && !flagged.length) {
    // 空结果要**如实说清是按什么筛空的**。⭐ 搜索也进这一行（业主 2026-10-15）：
    // 搜了没命中时写「当前搜索（搜索「x」）下没有…」，而不是让人以为站上一条都没有。
    // ⚠️ 没搜索时那两句**逐字保持原样**（老判据照旧）。
    const conds = [...ACTIVE.map((k) => KIND_TITLE[k] || k), ...ACTIVE_FUNC.map((k) => FUNC_TITLE[k] || k)];
    list.append(el('p', 'dim', ACTIVE_Q
      ? `当前搜索（${[`搜索「${ACTIVE_Q}」`, ...conds].join(' + ')}）下没有已上线的包。`
      : (conds.length
        ? `当前筛选（${conds.join(' + ')}）下没有已上线的包。`
        : '还没有通过审核的包。')));
    return;
  }
  // ⭐ 主分区**按功能类目**分（业主 2026-10-14：「现在分类不对，要按功能分」）。
  //    每一区一条判据、固定顺序，标题旁给条数；技术维度（装上会不会生效）**仍然画在每条卡片的徽标上**
  //    —— 两个维度正交，谁都不吞掉谁。`说明文档` 自成一区 ⇒ 业主那条
  //    「说明包不能混在功能包里」的要求**照旧成立**。
  for (const k of FUNC_ORDER) {
    const arr = mods.filter((m) => FUNC_OF(m) === k);
    if (!arr.length) continue;
    list.append(el('h2', 'sec', `${FUNC_TITLE[k]}（${arr.length}）`));
    list.append(el('p', 'sub', FUNC_HINT[k]));
    for (const m of arr) list.append(card(m, false, sameIdPeers(all, m)));
  }
  // 疑似素材**照旧单独一组、明确标注**：这一组说的是「素材版权」，与上面三区**正交** ——
  // 一条既可以是真功能，也可以带疑似素材。所以它不并进任何分区，只把分类徽标照实画在每条上。
  if (flagged.length) {
    const box = el('div', 'warnbox');
    box.append(el('h3', null, `含疑似官方素材的 mod（${flagged.length}）`));
    box.append(el('div', null, '这些包在自动检查里命中了「像官方解包素材」的特征（Spine 模型、官方立绘/语音路径等），' +
      '维护者已人工看过并放行。它们不是干净的工坊包：里面的素材版权与可用范围请自行判断，' +
      '也请勿据此再分发素材本身。仓库正式收录的 packs/ 不含这类素材。'));
    list.append(box);
    for (const m of flagged) {
      const c = card(m, true, sameIdPeers(all, m));
      if (m.suspectedReasons && m.suspectedReasons.length) {
        const b = c.querySelector('.panel__body');
        b.append(el('div', 'kv dim', '命中的特征：' + m.suspectedReasons.join('、')));
      }
      list.append(c);
    }
  }
}).catch(() => { list.textContent = '载入失败，刷新试试。'; });
</script>
</body>
</html>

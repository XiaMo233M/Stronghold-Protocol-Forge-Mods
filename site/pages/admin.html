<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审核 · 工坊包上传站</title>
<style>
  :root { color-scheme: light dark; --fg:#1b1f1d; --dim:#5c6b64; --line:#d5ddd8; --accent:#0f8f6f; --bad:#b03030; --warn:#c8901f; --bg:#f7faf8; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6ece9; --dim:#9aa8a1; --line:#2c3632; --accent:#4ed8af; --bad:#ff8080; --warn:#e8b64a; --bg:#111614; --card:#171d1a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:16px; padding:16px; }
  @media (max-width:820px) { .wrap { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  h1 { font-size:18px; margin:0 0 10px; }
  h2 { font-size:16px; margin:0 0 8px; }
  input[type=text], textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  button { padding:8px 14px; border:0; border-radius:8px; font:inherit; font-weight:700; cursor:pointer; }
  button.ok { background:var(--accent); color:#04140f; }
  button.no { background:var(--bad); color:#fff; }
  button.ghost { background:transparent; color:inherit; border:1px solid var(--line); font-weight:500; }
  button:disabled { opacity:.45; cursor:default; }
  ul { list-style:none; margin:0; padding:0; }
  li.item { padding:9px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:7px; cursor:pointer; }
  li.item:hover { border-color:var(--accent); }
  li.item.on { border-color:var(--accent); background:rgba(127,127,127,.08); }
  .badge { font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; border:1px solid var(--line); }
  .badge.pending { color:var(--warn); border-color:var(--warn); }
  .badge.approved { color:var(--accent); border-color:var(--accent); }
  .badge.rejected { color:var(--bad); border-color:var(--bad); }
  .dim { color:var(--dim); }
  .kv { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; word-break:break-all; }
  pre { background:rgba(127,127,127,.10); padding:10px; border-radius:8px; overflow:auto; max-height:280px; font-size:12.5px; }
  .flag { border-left:3px solid var(--line); padding:5px 0 5px 10px; margin:6px 0; font-size:13.5px; }
  .flag.blocker { border-color:var(--bad); }
  .flag.warn { border-color:var(--warn); }
  .lv { font-weight:700; font-size:11px; letter-spacing:.04em; }
  .flag.blocker .lv { color:var(--bad); }
  .flag.warn .lv { color:var(--warn); }
  .row { margin:0 0 10px; }
  .flex { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .note { white-space:pre-wrap; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="card" style="margin-bottom:16px">
      <h1>审核</h1>
      <p id="authNote" class="dim" style="font-size:13px;margin:0 0 10px">检查登录状态…</p>
      <div id="tokBox" style="display:none">
        <div class="row"><input id="tok" type="text" placeholder="ADMIN_TOKEN（若浏览器已登录，这里可以留空）"></div>
        <div class="flex">
          <button id="load" class="ok">载入列表</button>
          <button id="save" class="ghost">记住</button>
          <button id="forget" class="ghost">忘掉</button>
        </div>
        <p class="dim" style="font-size:12.5px;margin:8px 0 0">
          令牌只存在这个浏览器里（sessionStorage），不会发到别处。服务器上它在
          <code>/etc/sp-modsite.env</code> 的 <code>ADMIN_TOKEN=</code> 那一行（权限 600）。
        </p>
      </div>
    </div>
    <div class="card">
      <h2>投稿</h2>
      <ul id="list"><li class="dim">还没载入。</li></ul>
    </div>
  </div>
  <div>
    <div class="card" id="detail"><p class="dim">左边点一条投稿看详情。</p></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
let TOKEN = sessionStorage.getItem('adminToken') || '';
$('tok').value = TOKEN;

const API = '__ADMIN_API__';
const api = (p, opt = {}) => fetch(API + p, { ...opt, headers: { 'x-admin-token': TOKEN, ...(opt.headers || {}) } });

$('save').onclick = () => { TOKEN = $('tok').value.trim(); sessionStorage.setItem('adminToken', TOKEN); $('load').click(); };
$('forget').onclick = () => { TOKEN = ''; sessionStorage.removeItem('adminToken'); $('tok').value = ''; $('list').textContent = '已忘掉，重新填令牌。'; };
$('load').onclick = async () => {
  TOKEN = $('tok').value.trim();
  const r = await api('/list');
  if (!r.ok) { $('list').textContent = '载入失败：HTTP ' + r.status + '（令牌对吗？）'; return; }
  renderList(await r.json());
};

function renderList({ submissions }) {
  const ul = $('list'); ul.textContent = '';
  if (!submissions.length) { ul.append(el('li', 'dim', '还没有投稿。')); return; }
  for (const s of submissions) {
    const li = el('li', 'item');
    const top = el('div', 'flex');
    top.append(el('b', null, s.name || '(没名字)'));
    top.append(el('span', 'badge ' + s.state, s.state));
    if (s.suspected) top.append(el('span', 'badge rejected', '疑似素材'));
    if (s.area === 'flagged') top.append(el('span', 'badge pending', '在 flagged/'));
    li.append(top);
    li.append(el('div', 'dim', `${(s.size / 1048576).toFixed(2)} MB · ${String(s.uploadedAt).slice(0, 16).replace('T', ' ')}`));
    li.onclick = () => { [...ul.children].forEach((x) => x.classList.remove('on')); li.classList.add('on'); detail(s.id); };
    ul.append(li);
  }
}

// 页面加载时先看浏览器有没有带着 Basic 凭据（顶层导航的 401 已经弹过登录框了）。
// 有就直接进；没有才把令牌输入框露出来当后路。
(async () => {
  try {
    const r = await fetch(API + '/list');
    if (r.ok) {
      $('authNote').textContent = '已通过浏览器登录（HTTP Basic）。';
      $('tokBox').style.display = 'none';
      renderList(await r.json());
      return;
    }
  } catch { /* 网络问题就当没登录 */ }
  $('authNote').textContent = '需要登录：浏览器应当已经弹过登录框（用户名 admin，密码是服务器上的 ADMIN_TOKEN）。'
    + '要是没弹、或者你想手动填令牌，就用下面这一栏。';
  $('tokBox').style.display = 'block';
})();

async function detail(id) {
  const box = $('detail');
  box.textContent = '载入中…';
  const r = await api('/detail/' + id);
  if (!r.ok) { box.textContent = '载入失败：HTTP ' + r.status; return; }
  const { meta, entries, topLevel, download } = await r.json();
  box.textContent = '';

  box.append(el('h2', null, meta.name || '(没名字)'));
  box.append(el('div', 'kv', `编号 ${meta.id}\n大小 ${(meta.size / 1048576).toFixed(3)} MB\nsha256 ${meta.sha256}\n上传 ${meta.uploadedAt}\n来自 ${meta.ip}`));
  if (meta.note) { const n = el('div', 'note'); n.style.marginTop = '10px'; n.textContent = meta.note; box.append(n); }
  if (meta.homepage) {
    const p = el('div'); p.append(document.createTextNode('原件来源：'));
    const a = el('a', null, meta.homepage); a.href = meta.homepage; a.rel = 'noopener noreferrer nofollow'; p.append(a);
    box.append(p);
  }

  // ① 下载（跑测试要用它）
  //    不能用普通的 <a href> 直链：那样只有「浏览器弹框登录」（HTTP Basic）才带得上凭据；
  //    手填令牌那条路是把令牌放在 x-admin-token 请求头里的，<a> 带不上 → 必然 403。
  //    改成 fetch + blob：浏览器登录与手填令牌两种方式都能下。
  const bar = el('div', 'flex'); bar.style.margin = '12px 0';
  const dl = el('button', 'ok', '下载 zip（拿去跑测试）');
  dl.onclick = async () => {
    dl.disabled = true;
    dl.textContent = '下载中…';
    try {
      const r = await fetch(download, { headers: TOKEN ? { 'x-admin-token': TOKEN } : {} });
      if (!r.ok) {
        dl.textContent = `下载失败 HTTP ${r.status} —— 待审的包要维护者身份，先登录`;
        return;
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${meta.id}-${String(meta.name || 'mod').replace(/[\\/:*?"<>|]/g, '_')}.zip`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      dl.textContent = `已下载 ${(blob.size / 1048576).toFixed(2)} MB（再点一次可重下）`;
    } catch (e) {
      dl.textContent = '下载出错：' + e.message;
    } finally {
      dl.disabled = false;
    }
  };
  bar.append(dl);
  if (meta.decision) bar.append(el('span', 'badge ' + meta.decision.decision, meta.decision.decision));
  box.append(bar);

  // ② 自动挑出来的重点
  box.append(el('h2', null, '要人眼确认的地方'));
  const flags = meta.flags || [];
  if (!flags.length) box.append(el('p', 'dim', '没有自动挑出东西。'));
  for (const f of flags) {
    const d = el('div', 'flag ' + f.level);
    d.append(el('span', 'lv', f.level.toUpperCase()), document.createTextNode(' ' + f.code + ' — ' + f.text));
    box.append(d);
  }

  // ③ 顶层分布 + 条目
  const tops = Object.entries(topLevel || {}).sort((a, b) => b[1] - a[1]);
  if (tops.length) {
    box.append(el('h2', null, '顶层分布'));
    box.append(el('pre', null, tops.map(([k, v]) => `${(v / 1048576).toFixed(2).padStart(8)} MB  ${k}`).join('\n')));
  }
  if (entries && entries.length) {
    box.append(el('h2', null, `包内文件（前 ${entries.length} 条）`));
    box.append(el('pre', null, entries.map((e) => `${String((e.uncompSize / 1024).toFixed(0)).padStart(7)} KB  ${e.name}`).join('\n')));
  }

  // ④ 决定
  box.append(el('h2', null, '决定'));
  const nameRow = el('div', 'row');
  nameRow.append(el('div', 'dim', '上线显示名（留空就用投稿填的）'));
  const dn = el('input'); dn.type = 'text'; dn.value = meta.name || ''; nameRow.append(dn);
  box.append(nameRow);
  const reasonRow = el('div', 'row');
  reasonRow.append(el('div', 'dim', '打回理由（打回时必填；通过时可以留一句备注）'));
  const rs = el('textarea'); rs.rows = 2; reasonRow.append(rs);
  box.append(reasonRow);

  // 疑似素材：可以上线，但必须显式确认过 —— 上线后会在公开列表里单独一组并标注
  let ack = null;
  if (meta.suspected) {
    const w = el('div', 'flag blocker');
    w.append(el('span', 'lv', '疑似官方素材'), document.createTextNode(
      ' 这个包命中了「像官方解包素材」的特征，已单独存放在 flagged/。仍然可以上线，但公开列表会把它归到'
      + '「含疑似官方素材」那一组并明确标注；仓库的 packs/ 里不会收这类素材。'));
    box.append(w);
    const lab = el('label');
    lab.style.cssText = 'display:flex;gap:8px;align-items:center;margin:8px 0 12px';
    ack = el('input'); ack.type = 'checkbox';
    lab.append(ack, document.createTextNode('我已看过这些标记，仍要上线（公开时会标注）'));
    box.append(lab);
  }

  const acts = el('div', 'flex');
  const okB = el('button', 'ok', '通过并上线');
  const noB = el('button', 'no', '打回');
  acts.append(okB, noB);
  box.append(acts);

  const decide = async (decision) => {
    if (decision === 'rejected' && !rs.value.trim()) { alert('打回要写理由。'); return; }
    if (decision === 'approved' && ack && !ack.checked) { alert('这是疑似素材的包：上线会在公开列表里标注，先勾上确认。'); return; }
    okB.disabled = noB.disabled = true;
    const r2 = await api('/decide', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, decision, reason: rs.value.trim(), displayName: dn.value.trim(), acknowledge: ack ? ack.checked : false }),
    });
    const j = await r2.json();
    if (!r2.ok) { alert('没成：' + (j.error || r2.status)); okB.disabled = false; noB.disabled = false; return; }
    alert(decision === 'approved' ? '已上线。' : '已打回。');
    $('load').click();
    detail(id);
  };
  okB.onclick = () => decide('approved');
  noB.onclick = () => decide('rejected');
}
</script>
</body>
</html>

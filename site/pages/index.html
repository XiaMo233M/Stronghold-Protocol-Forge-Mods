<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上传一个 mod · 卫戍协议 Forge 工坊包</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230c0f0e'/%3E%3Cpath fill='%234ed8af' d='M5 3h3v2h2V3h4v2h2V3h3v5l-2 2v7l2 2v2H5v-2l2-2v-7L5 8z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="__CSS__">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">工坊包 <b>·</b> 上传站 <span class="sub2">SP MODSITE</span></a>
  <nav class="navlinks">
    <a href="/" class="on">上传</a>
    <a href="/mods">已上线</a>
  </nav>
</header>

<section class="panel brackets panel--glow">
  <div class="panel__head">
    <div class="panel__titles">
      <span class="panel__title">投稿一个 mod</span>
      <span class="panel__sub">传上来只是投稿；维护者下载跑测试、审过之后才会上线</span>
    </div>
  </div>
  <div class="panel__body">
    <p class="sub">流程与要求见仓库的
      <a href="https://github.com/XiaMo233M/Stronghold-Protocol-Forge-Mods/blob/main/UPLOAD.md">UPLOAD.md</a>。
      想看已经过审的包，去 <a href="/mods">已上线的列表</a>。</p>

    <div class="field">
      <label class="field__label" for="name">mod 名 <span class="field__hint">必填。这就是列表里显示的名字，请写清楚、别蹭「官方」</span></label>
      <input id="name" type="text" maxlength="60" placeholder="例如：卡兹戴尔同人内容包">
    </div>

    <div class="field">
      <label class="field__label" for="note">备注 <span class="field__hint">原件叫什么、从哪来、原作者、许可、改了什么、素材哪来的 —— 见 UPLOAD.md 的五件事</span></label>
      <div class="field__box field__box--area brackets">
        <textarea id="note" maxlength="4000" placeholder="原件名称与来源 URL：&#10;原作者：&#10;原件许可：&#10;改了什么：&#10;自带素材来源："></textarea>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="homepage">原件的链接 <span class="field__hint">选填。仓库 / 发布页</span></label>
      <input id="homepage" type="text" maxlength="300" placeholder="https://">
    </div>

    <div class="field">
      <label class="field__label" for="file">zip 文件 <span class="field__hint">只收 zip；包内文件直接放 zip 根，不要套一层文件夹</span></label>
      <input id="file" type="file" accept=".zip,application/zip">
      <p class="sub" id="limit"></p>
    </div>

    <button id="go" class="btn btn--primary btn--block">上传</button>
    <div class="bar" id="bar"><i></i></div>
    <div class="sub" id="rate"></div>
    <div class="out" id="out"></div>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

// ⭐ 认领码（业主 2026-10-12 需求 ①：「发布者能自由管理修改」）。
// **只在这一个响应里出现一次** —— 站点只存它的哈希，刷新页面就再也看不到明文了。
// 所以这里必须**显眼地把「请现在保存」写出来**，并把下一步（去「我的投稿」换发布者令牌）给成链接。
function claimBox(r) {
  if (!r || !r.claimCode) return '';
  return '<div class="warnbox"><h3>这串认领码只显示这一次，请现在保存</h3>' +
    '<p class="kv"><b>' + esc(r.claimCode) + '</b></p>' +
    '<p>' + esc(r.claimNote || '') + '</p>' +
    '<p>下一步：打开 <a href="' + esc(r.publisherPage || '/mine') + '">我的投稿</a>，' +
    '填「编号 + 认领码」换一枚<b>发布者令牌</b>。之后改名 / 改备注 / 改分类、换包体、申请撤下，' +
    '都在那一页自己做；每次改动都会<b>回到待审</b>，等维护者复审。</p></div>';
}
function renderFlags(flags) {
  if (!flags || !flags.length) return '';
  return flags.map((f) =>
    '<div class="flag ' + esc(f.level) + '"><span class="lv">' + esc(f.level.toUpperCase()) + '</span> ' +
    esc(f.code) + ' — ' + esc(f.text) + '</div>').join('');
}

// ⭐⭐ 上传失败的分类提示（2026-10-14「传一半就断」修复的前端那一半）。
//
// 改之前的写法是：`xhr.onerror = () => { … out.textContent = '网络断了，再试一次。'; }` ——
// **无论真实原因是什么，都只写这一句**。于是：
//   · 服务端等超时回的 408 ⇒ 显示「网络断了」；
//   · 包超过上限回的 413 ⇒ 显示「网络断了」；
//   · 限流回的 429     ⇒ 显示「网络断了」。
// 用户照着「再试一次」重传，结果一模一样地再断一次 —— 真话被这句一律性文案吞掉了。
// 现在按**真实状态码**分类，每种给一个可行动的下一步。
const MAX_MB = Number('__MAX_MB__') || 100;          // 服务端注入（MAX_MB），不在这里写死
const MAX_BYTES = MAX_MB * 1048576;
const LIMIT_MIN = 15;                                 // 与 server.mjs 的 requestTimeout 同一个数
// 由时限推出的用户判据：包大小 ÷ 上行速度 < 时限 ⇒ 「多少 KB/s 才传得完」。
const kbpsFor = (mb) => Math.ceil(mb * 1024 / (LIMIT_MIN * 60));

function failText(status, r) {
  if (status === 408) {
    return '上传超时：这次上传超过了服务端的 ' + LIMIT_MIN + ' 分钟时限。多半是上行太慢 —— '
      + '25 MB 的包需要上行快于约 ' + kbpsFor(25) + ' KB/s。请换更快的网络，或缩小包体。';
  }
  if (status === 413) {
    return '文件太大（上限 ' + ((r && r.maxMB) || MAX_MB) + ' MB）：'
      + ((r && r.error) || '请缩小包体再传。');
  }
  if (status === 429) {
    return '传得太频繁了，请等 ' + ((r && r.retryAfterMin) || 10) + ' 分钟再传。';
  }
  if (status >= 500) return '服务端出错（HTTP ' + status + '）：' + ((r && r.error) || '稍后再试');
  if (status === 0) {
    return '网络断了（没拿到服务端的任何响应），再试一次。若总是传到一半就断：'
      + '多半是上行太慢撞上了服务端时限，或链路（代理 / 隧道）被中间设备断开 —— 请换网络或缩小包体。';
  }
  return '没传上（HTTP ' + status + '）：' + ((r && r.error) || '再试一次');
}
function showFail(status, r) {
  $('rate').textContent = '';
  $('out').innerHTML = '<p style="color:var(--red-premium)">没传上：' + esc(failText(status, r)) + '</p>'
    + renderFlags(r && r.flags);
}

// 上传前就把「多久算安全」摆出来（原来页面上一个字都没有，用户只能靠猜）。
$('limit').innerHTML = '上限 ' + MAX_MB + ' MB。服务端给一次上传 ' + LIMIT_MIN + ' 分钟 —— '
  + '<b>上行慢于约 ' + kbpsFor(25) + ' KB/s 时，25 MB 的包就会超过这个时限被判超时</b>；'
  + '请先测一下上行，或改用更小的包。';

$('go').onclick = () => {
  const name = $('name').value.trim();
  const file = $('file').files[0];
  const out = $('out');
  if (!name) { out.textContent = '先填 mod 名。'; return; }
  if (!file) { out.textContent = '先选一个 zip。'; return; }
  if (!/\.zip$/i.test(file.name)) { out.textContent = '只收 zip。'; return; }
  // ⭐ 本地体积预检：超过上限就不发请求（原来是传到一半才被 413 掐，用户白等一次）。
  if (file.size > MAX_BYTES) {
    out.textContent = '文件太大：' + (file.size / 1048576).toFixed(1) + ' MB，上限 ' + MAX_MB
      + ' MB —— 没发请求，请缩小包体再来。';
    return;
  }

  const q = new URLSearchParams({ name, note: $('note').value.trim(), homepage: $('homepage').value.trim() });
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/submit?' + q.toString());
  xhr.setRequestHeader('content-type', 'application/zip');
  xhr.setRequestHeader('x-filename', encodeURIComponent(file.name));
  // 客户端也设一道兜底时限（比服务端多 2 分钟）：链路整个挂住时，至少能给出「超时」这句真话，
  // 而不是一直停在「上传中…」。服务端那道 15 分钟才是判定上传是否被接受的那一道。
  xhr.timeout = (LIMIT_MIN + 2) * 60000;
  $('go').disabled = true;
  $('bar').style.display = 'block';
  $('rate').textContent = '';
  out.textContent = '上传中…';

  const t0 = Date.now();
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    // 进度条结构（2026-10-14 实测核对）：`#bar` 的第一个元素子节点就是样式表 `.bar > i` 命中的
    // 那个 `<i>`，两者**是匹配的** —— 所以这里不改结构，只把宽度写进去（原来这一段没问题）。
    const bar = $('bar').firstElementChild;
    if (bar) bar.style.width = (e.loaded / e.total * 100).toFixed(1) + '%';
    const sec = (Date.now() - t0) / 1000;
    // 头几秒的瞬时速度没有意义（第一个 progress 事件可能在 0.1 秒内就到，算出来是个天文数字），
    // 所以满 3 秒才显示速度；在那之前只报百分比。
    $('rate').textContent = '已传 ' + (e.loaded / e.total * 100).toFixed(1) + '%'
      + (sec >= 3
        ? ' · 约 ' + Math.round(e.loaded / 1024 / sec) + ' KB/s（25 MB 的包需要上行快于约 ' + kbpsFor(25)
          + ' KB/s；慢于此会被服务端的 ' + LIMIT_MIN + ' 分钟时限掐断）'
        : '（正在估算上行速度…）');
  };
  xhr.onload = () => {
    $('go').disabled = false;
    let r = null;
    try { r = JSON.parse(xhr.responseText); } catch { /* 非 JSON */ }
    if (xhr.status === 201 && r) {
      $('rate').textContent = '';
      out.innerHTML =
        '<p><b>收到了。</b></p>' +
        '<p class="kv">编号：' + esc(r.id) + '<br>回执令牌：' + esc(r.receipt) + '</p>' +
        '<p>把上面这两行留着，随时可以查状态：<br><a href="' + esc(r.statusUrl) + '">' + esc(r.statusUrl) + '</a></p>' +
        claimBox(r) +
        '<p>' + esc(r.message) + '</p>' + renderFlags(r.flags);
    } else {
      // 服务端只要把话说完（含 408 / 413 / 429），就一定走这里 —— 按真实状态码分类说人话。
      showFail(xhr.status, r);
    }
  };
  xhr.onerror = () => { $('go').disabled = false; showFail(xhr.status, null); };
  xhr.ontimeout = () => { $('go').disabled = false; showFail(408, null); };
  xhr.send(file);
};
</script>
</body>
</html>

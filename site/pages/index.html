<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上传一个 mod · 卫戍协议 Forge 工坊包</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230c0f0e'/%3E%3Cpath fill='%234ed8af' d='M5 3h3v2h2V3h4v2h2V3h3v5l-2 2v7l2 2v2H5v-2l2-2v-7L5 8z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="__CSS__">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">工坊包 <b>·</b> 上传站 <span class="sub2">SP MODSITE</span></a>
  <nav class="navlinks">
    <a href="/" class="on">上传</a>
    <a href="/mods">已上线</a>
  </nav>
</header>

<section class="panel brackets panel--glow">
  <div class="panel__head">
    <div class="panel__titles">
      <span class="panel__title">投稿一个 mod</span>
      <span class="panel__sub">传上来只是投稿；维护者下载跑测试、审过之后才会上线</span>
    </div>
  </div>
  <div class="panel__body">
    <p class="sub">流程与要求见仓库的
      <a href="https://github.com/XiaMo233M/Stronghold-Protocol-Forge-Mods/blob/main/UPLOAD.md">UPLOAD.md</a>。
      想看已经过审的包，去 <a href="/mods">已上线的列表</a>。</p>

    <div class="field">
      <label class="field__label" for="name">mod 名 <span class="field__hint">必填。这就是列表里显示的名字，请写清楚、别蹭「官方」</span></label>
      <input id="name" type="text" maxlength="60" placeholder="例如：卡兹戴尔同人内容包">
    </div>

    <div class="field">
      <label class="field__label" for="note">备注 <span class="field__hint">原件叫什么、从哪来、原作者、许可、改了什么、素材哪来的 —— 见 UPLOAD.md 的五件事</span></label>
      <div class="field__box field__box--area brackets">
        <textarea id="note" maxlength="4000" placeholder="原件名称与来源 URL：&#10;原作者：&#10;原件许可：&#10;改了什么：&#10;自带素材来源："></textarea>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="homepage">原件的链接 <span class="field__hint">选填。仓库 / 发布页</span></label>
      <input id="homepage" type="text" maxlength="300" placeholder="https://">
    </div>

    <div class="field">
      <label class="field__label" for="file">zip 文件 <span class="field__hint">只收 zip；包内文件直接放 zip 根，不要套一层文件夹</span></label>
      <input id="file" type="file" accept=".zip,application/zip">
    </div>

    <button id="go" class="btn btn--primary btn--block">上传</button>
    <div class="bar" id="bar"><i></i></div>
    <div class="out" id="out"></div>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

function renderFlags(flags) {
  if (!flags || !flags.length) return '';
  return flags.map((f) =>
    '<div class="flag ' + esc(f.level) + '"><span class="lv">' + esc(f.level.toUpperCase()) + '</span> ' +
    esc(f.code) + ' — ' + esc(f.text) + '</div>').join('');
}

$('go').onclick = () => {
  const name = $('name').value.trim();
  const file = $('file').files[0];
  const out = $('out');
  if (!name) { out.textContent = '先填 mod 名。'; return; }
  if (!file) { out.textContent = '先选一个 zip。'; return; }
  if (!/\.zip$/i.test(file.name)) { out.textContent = '只收 zip。'; return; }

  const q = new URLSearchParams({ name, note: $('note').value.trim(), homepage: $('homepage').value.trim() });
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/submit?' + q.toString());
  xhr.setRequestHeader('content-type', 'application/zip');
  xhr.setRequestHeader('x-filename', encodeURIComponent(file.name));
  $('go').disabled = true;
  $('bar').style.display = 'block';
  out.textContent = '上传中…';

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) $('bar').firstElementChild.style.width = (e.loaded / e.total * 100).toFixed(1) + '%';
  };
  xhr.onload = () => {
    $('go').disabled = false;
    let r = null;
    try { r = JSON.parse(xhr.responseText); } catch { /* 非 JSON */ }
    if (xhr.status === 201 && r) {
      out.innerHTML =
        '<p><b>收到了。</b></p>' +
        '<p class="kv">编号：' + esc(r.id) + '<br>回执令牌：' + esc(r.receipt) + '</p>' +
        '<p>把上面这两行留着，随时可以查状态：<br><a href="' + esc(r.statusUrl) + '">' + esc(r.statusUrl) + '</a></p>' +
        '<p>' + esc(r.message) + '</p>' + renderFlags(r.flags);
    } else {
      out.innerHTML = '<p style="color:var(--red-premium)">没传上：' + esc(r && r.error ? r.error : ('HTTP ' + xhr.status)) + '</p>' + renderFlags(r && r.flags);
    }
  };
  xhr.onerror = () => { $('go').disabled = false; out.textContent = '网络断了，再试一次。'; };
  xhr.send(file);
};
</script>
</body>
</html>
